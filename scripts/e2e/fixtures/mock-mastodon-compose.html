<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mock Mastodon Compose</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 32px; }
    .compose-form { width: 640px; border: 1px solid #ddd; padding: 16px; border-radius: 8px; }
    textarea { display: block; width: 600px; min-height: 96px; margin-bottom: 12px; }
    button { min-width: 96px; min-height: 36px; }
  </style>
</head>
<body>
  <main class="compose-form">
    <span class="display-name__account">@mockmastodon</span>
    <textarea class="autosuggest-textarea__textarea" aria-label="Post text"></textarea>
    <button class="button" type="submit">Publish</button>
  </main>
  <script>
    window.__tuttiMockMastodonState = { text: '', submitClicks: 0 };
    const textarea = document.querySelector('textarea');
    textarea.addEventListener('input', () => {
      window.__tuttiMockMastodonState.text = textarea.value;
    });
    document.querySelector('button[type="submit"]').addEventListener('click', () => {
      window.__tuttiMockMastodonState.submitClicks += 1;
    });
  </script>
</body>
</html>
