#:schema node_modules/wrangler/config-schema.json
name = "tutti-report"
main = "src/index.ts"
compatibility_date = "2026-04-01"
# account_id を明示しておくと wrangler が User /memberships を fetch しなくて済む
# (CF API token が User->Memberships 権限を持たない最小権限運用への対策)
account_id = "91b2e77a051758eae7ec8faf2660384d"

# secret は wrangler secret put で別途登録する(コードに含めない):
#   wrangler secret put GITHUB_TOKEN  # komm64/tutti-issues の Issues write のみを持つ PAT

# rate-limit 用の KV namespace (2026-11-12 作成)。外すと rate limit が無効になる。
# 上限は env (RATE_LIMIT_SECONDS / DAILY_LIMIT / GLOBAL_DAILY_LIMIT) で変えられる。
# 既定値は src/rate-limit.ts。
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "72106c770812422e940d7139b335e4ed"

# (オプション) GITHUB_REPO を上書きしたい場合(デフォルト komm64/tutti-issues)。
# 報告には redacted とはいえ診断情報が入るので、public repo を指定しないこと。
# [vars]
# GITHUB_REPO = "komm64/tutti-issues"
